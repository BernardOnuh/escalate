<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Escalate</title>
  <desc id="d">Local first, cloud only when it counts. Most prompts go to the local model; a few escalate through Otari to the cloud; prompts with secrets stay local.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="glow" cx="0.76" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#4cc38a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4cc38a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="400" rx="20" fill="#0e1013"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="20" fill="url(#glow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="160" fill="#f2f2ee" font-size="88" font-weight="750" letter-spacing="-3">Escalate</text>
    <text x="84" y="214" fill="#f2f2ee" font-size="30" font-weight="600">Local first. Cloud only when it counts.</text>
    <text x="84" y="258" fill="#9a9a94" font-size="19">Secrets never leave your machine. An OpenAI-compatible</text>
    <text x="84" y="284" fill="#9a9a94" font-size="19">router in front of Mozilla.ai's Otari gateway.</text>
    <g font-size="14" font-weight="600">
      <rect x="84" y="316" width="132" height="30" rx="15" fill="#4cc38a" fill-opacity="0.14" stroke="#4cc38a" stroke-opacity="0.5"/>
      <text x="150" y="336" fill="#4cc38a" text-anchor="middle">local first</text>
      <rect x="226" y="316" width="102" height="30" rx="15" fill="#7c95f5" fill-opacity="0.14" stroke="#7c95f5" stroke-opacity="0.5"/>
      <text x="277" y="336" fill="#7c95f5" text-anchor="middle">self-check</text>
      <rect x="338" y="316" width="122" height="30" rx="15" fill="#f0a04b" fill-opacity="0.14" stroke="#f0a04b" stroke-opacity="0.5"/>
      <text x="399" y="336" fill="#f0a04b" text-anchor="middle">privacy guard</text>
    </g>

    <!-- router -->
    <rect x="770" y="160" width="130" height="80" rx="18" fill="#1a1d23" stroke="#f2f2ee" stroke-opacity="0.5" stroke-width="2"/>
    <text x="835" y="196" fill="#f2f2ee" font-size="17" font-weight="700" text-anchor="middle">Escalate</text>
    <text x="835" y="218" fill="#9a9a94" font-size="12" text-anchor="middle">decides per prompt</text>
    <path d="M700 200 H 768" stroke="#9a9a94" stroke-width="3"/>
    <text x="700" y="186" fill="#9a9a94" font-size="13" font-weight="600">prompt</text>

    <!-- local (thick) -->
    <path d="M900 185 C 960 185, 960 110, 1020 110" fill="none" stroke="#4cc38a" stroke-width="8" stroke-linecap="round"/>
    <rect x="1024" y="74" width="196" height="72" rx="16" fill="#1a1d23" stroke="#4cc38a" stroke-width="2"/>
    <g transform="translate(1052 110)" stroke="#4cc38a" stroke-width="2.5" fill="none" stroke-linejoin="round">
      <rect x="-14" y="-12" width="28" height="18" rx="2"/>
      <path d="M-18 10 H18"/>
    </g>
    <text x="1078" y="106" fill="#f2f2ee" font-size="16" font-weight="700">Your laptop</text>
    <text x="1078" y="127" fill="#4cc38a" font-size="13" font-weight="600">most prompts · free</text>

    <!-- cloud (thin) -->
    <path d="M900 215 C 960 215, 960 290, 1020 290" fill="none" stroke="#7c95f5" stroke-width="3" stroke-linecap="round"/>
    <rect x="1024" y="254" width="196" height="72" rx="16" fill="#1a1d23" stroke="#7c95f5" stroke-width="2"/>
    <g transform="translate(1052 292)" stroke="#7c95f5" stroke-width="2.5" fill="none" stroke-linejoin="round">
      <path d="M-12 6 a8 8 0 0 1 2 -15 a10 10 0 0 1 19 3 a7 7 0 0 1 3 12 z"/>
    </g>
    <text x="1078" y="286" fill="#f2f2ee" font-size="16" font-weight="700">Cloud via Otari</text>
    <text x="1078" y="307" fill="#7c95f5" font-size="13" font-weight="600">hard ones · budgeted</text>

    <!-- secret stays local -->
    <g transform="translate(962 152)">
      <circle r="15" fill="#2a1f12" stroke="#f0a04b" stroke-width="2"/>
      <g fill="none" stroke="#f0a04b" stroke-width="2" stroke-linecap="round">
        <rect x="-6" y="-1" width="12" height="9" rx="2" fill="#f0a04b" fill-opacity="0.3"/>
        <path d="M-3.5 -1 V-4 a3.5 3.5 0 0 1 7 0 V-1"/>
      </g>
    </g>
    <text x="984" y="176" fill="#f0a04b" font-size="12" font-weight="700">secrets stay here</text>
  </g>
</svg>
